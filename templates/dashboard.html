<!DOCTYPE html>
<html>

<head>
    <title>Financial Simulation Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .chart-container {
            width: 100%;
            height: 450px;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <h1>Financial Simulation Dashboard</h1>

    <div id="assets_chart" class="chart-container"></div>
    <div id="flows_chart" class="chart-container"></div>
    <div id="market_chart" class="chart-container"></div>

    <script>
        const data = {{ data | tojson | safe }};

        // 1. Assets Chart
        const assetTraces = [
            { x: data.years, y: data.assets.brokerage, name: 'Brokerage', type: 'scatter' },
            { x: data.years, y: data.assets.traditional, name: 'Traditional', type: 'scatter' },
            { x: data.years, y: data.assets.roth, name: 'Roth', type: 'scatter' },
            { x: data.years, y: data.assets.hsa, name: 'HSA', type: 'scatter' },
            {
                x: data.years, y: data.assets.liquid_assets, name: 'Total Liquid Assets',
                line: { width: 3, dash: 'dot', color: 'black' }
            }
        ];
        Plotly.newPlot('assets_chart', assetTraces, {
            title: 'Account Balances Over Time',
            yaxis: { title: 'Balance ($)' },
            template: 'plotly_white', hovermode: 'x unified'
        });

        // 2. Yearly Flows Chart
        const flowTraces = [
            { x: data.years, y: data.flows.income, name: 'Gross Income', type: 'bar' },
            { x: data.years, y: data.flows.withdrawals, name: 'Total Withdrawals', type: 'bar' },
            {
                x: data.years, y: data.flows.spending, name: 'Total Spending (Lifestyle + Tax + Mortgage)',
                type: 'scatter', line: { color: 'red', width: 2 }
            }
        ];
        Plotly.newPlot('flows_chart', flowTraces, {
            title: 'Yearly Cash Flows (Income, Spending, & Withdrawals)',
            yaxis: { title: 'Amount ($)' },
            barmode: 'group',
            template: 'plotly_white', hovermode: 'x unified'
        });

        // 3. Market Conditions Chart
        const marketTraces = [
            { x: data.years, y: data.market.inflation, name: 'Inflation Rate' },
            { x: data.years, y: data.market.stocks, name: 'Stock Return' },
            { x: data.years, y: data.market.bonds, name: 'Bond Return' }
        ];
        Plotly.newPlot('market_chart', marketTraces, {
            title: 'Simulated Market Conditions',
            yaxis: { title: 'Annual Rate', tickformat: ',.0%' },
            template: 'plotly_white', hovermode: 'x unified'
        });
    </script>
</body>

</html>
